spring:
  application:
    name: luoning

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/luoning
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 1440
  storage:
    video-dir: uploads/videos
  # Dia chi backend nhin tu trinh duyet, dung de tao link phat video
  public-base-url: http://localhost:8080
